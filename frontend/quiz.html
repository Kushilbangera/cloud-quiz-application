<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Quiz | Cloud Quiz Application</title>

    <link rel="stylesheet" href="css/quiz.css">
</head>

<body>

<header class="quiz-header">
    <div class="brand">
        ☁️ Cloud Quiz
    </div>

    <div class="quiz-info">
        <span id="quizTitle">Loading Quiz...</span>
        <span id="timer">10:00</span>
    </div>
</header>


<main class="quiz-container">

    <!-- Progress -->
    <div class="progress-section">

        <div class="progress-top">
            <span id="questionNumber">Question 1 of 10</span>
            <span id="progressPercent">10%</span>
        </div>

        <div class="progress-bar">
            <div id="progressFill"></div>
        </div>

    </div>


    <!-- Question Card -->
    <section class="question-card">

        <div class="question-number" id="questionBadge">
            Question 1
        </div>

        <h1 id="questionText">
            Loading question...
        </h1>

        <div id="optionsContainer" class="options-container">
            <!-- Options generated by JavaScript -->
        </div>

    </section>


    <!-- Navigation -->
    <div class="navigation">

        <button id="previousBtn" class="nav-btn secondary">
            ← Previous
        </button>

        <button id="nextBtn" class="nav-btn primary">
            Next →
        </button>

        <button id="submitBtn" class="nav-btn submit">
            Submit Quiz
        </button>

    </div>


    <!-- Question Palette -->
    <section class="palette-section">

        <h3>Questions</h3>

        <div id="questionPalette" class="question-palette">
            <!-- Generated dynamically -->
        </div>

    </section>

</main>


<!-- Submit Confirmation Modal -->
<div id="submitModal" class="modal hidden">

    <div class="modal-box">

        <h2>Submit Quiz?</h2>

        <p>
            Are you sure you want to submit your quiz?
            You won't be able to change your answers afterward.
        </p>

        <div class="modal-actions">

            <button id="cancelSubmit" class="nav-btn secondary">
                Cancel
            </button>

            <button id="confirmSubmit" class="nav-btn submit">
                Submit
            </button>

        </div>

    </div>

</div>


<script src="js/quiz.js"></script>

</body>
</html>
