<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Quiz Builder | Cloud Quiz</title>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="stylesheet" href="css/style.css">

    <style>
        .admin-page {
            min-height: 100vh;
            background: #f5f7fb;
            padding: 30px;
        }

        .admin-header {
            background: linear-gradient(135deg, #111827, #312e81);
            color: white;
            border-radius: 22px;
            padding: 30px;
            margin-bottom: 25px;
        }

        .admin-header h1 {
            margin: 0 0 8px;
            font-size: 30px;
        }

        .admin-header p {
            margin: 0;
            opacity: .8;
        }

        .builder-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
        }

        .admin-card {
            background: white;
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,.06);
        }

        .admin-card h2 {
            margin-top: 0;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 17px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 7px;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 12px 14px;
            border: 1px solid #dbe1ea;
            border-radius: 10px;
            font-size: 14px;
            outline: none;
        }

        .form-group textarea {
            min-height: 90px;
            resize: vertical;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            border-color: #6366f1;
        }

        .btn {
            border: none;
            border-radius: 10px;
            padding: 12px 18px;
            cursor: pointer;
            font-weight: 700;
            transition: .2s;
        }

        .btn-primary {
            background: #4f46e5;
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-1px);
            background: #4338ca;
        }

        .btn-success {
            background: #059669;
            color: white;
        }

        .btn-secondary {
            background: #eef2ff;
            color: #4338ca;
        }

        .question-card {
            border: 1px solid #e5e7eb;
            border-radius: 14px;
            padding: 18px;
            margin-top: 15px;
        }

        .question-number {
            font-weight: 800;
            color: #4f46e5;
            margin-bottom: 10px;
        }

        .option-row {
            padding: 8px 10px;
            background: #f8fafc;
            border-radius: 8px;
            margin-top: 7px;
        }

        .quiz-created {
            background: #ecfdf5;
            border: 1px solid #a7f3d0;
            color: #065f46;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
            display: none;
        }

        .full-width {
            grid-column: 1 / -1;
        }

        .empty-state {
            text-align: center;
            color: #6b7280;
            padding: 25px;
        }

        @media (max-width: 850px) {
            .builder-grid {
                grid-template-columns: 1fr;
            }

            .admin-page {
                padding: 15px;
            }
        }
    </style>
</head>

<body>

<div class="admin-page">

    <!-- HEADER -->
    <div class="admin-header">
        <h1>
            <i class="fa-solid fa-screwdriver-wrench"></i>
            Admin Quiz Builder
        </h1>

        <p>
            Create quizzes, add questions and publish them to students.
        </p>
    </div>


    <!-- SUCCESS MESSAGE -->
    <div id="quizCreatedMessage" class="quiz-created">
        <strong>🎉 Quiz created successfully!</strong>
        <div id="createdQuizInfo"></div>
    </div>


    <div class="builder-grid">

        <!-- CREATE QUIZ -->
        <div class="admin-card">

            <h2>
                <i class="fa-solid fa-file-circle-plus"></i>
                Create Quiz
            </h2>

            <form id="quizForm">

                <div class="form-group">
                    <label>Quiz Title</label>
                    <input
                        type="text"
                        id="quizTitle"
                        placeholder="Example: Python Basics"
                        required>
                </div>

                <div class="form-group">
                    <label>Description</label>

                    <textarea
                        id="quizDescription"
                        placeholder="Describe this quiz..."></textarea>
                </div>

                <div class="form-group">
                    <label>Category</label>

                    <input
                        type="text"
                        id="quizCategory"
                        placeholder="Example: Programming"
                        required>
                </div>

                <div class="form-group">
                    <label>Difficulty</label>

                    <select id="quizDifficulty" required>
                        <option value="">Select difficulty</option>
                        <option value="Easy">Easy</option>
                        <option value="Medium">Medium</option>
                        <option value="Hard">Hard</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Subject ID</label>

                    <input
                        type="number"
                        id="quizSubjectId"
                        placeholder="Example: 1">
                </div>

                <div class="form-group">
                    <label>Topic ID</label>

                    <input
                        type="number"
                        id="quizTopicId"
                        placeholder="Example: 1">
                </div>

                <div class="form-group">
                    <label>Time Limit (minutes)</label>

                    <input
                        type="number"
                        id="quizTime"
                        value="10"
                        min="1">
                </div>

                <div class="form-group">
                    <label>Access Type</label>

                    <select id="quizAccess">
                        <option value="free">Free</option>
                        <option value="premium">Premium</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Publish Quiz</label>

                    <select id="quizPublished">
                        <option value="true">Yes</option>
                        <option value="false">No - Draft</option>
                    </select>
                </div>

                <button class="btn btn-primary" type="submit">
                    <i class="fa-solid fa-plus"></i>
                    Create Quiz
                </button>

            </form>

        </div>


        <!-- ADD QUESTION -->
        <div class="admin-card">

            <h2>
                <i class="fa-solid fa-circle-question"></i>
                Add Question
            </h2>

            <div class="form-group">

                <label>Quiz ID</label>

                <input
                    type="number"
                    id="questionQuizId"
                    placeholder="Create a quiz first">
            </div>

            <form id="questionForm">

                <div class="form-group">

                    <label>Question</label>

                    <textarea
                        id="questionText"
                        placeholder="Enter your question..."
                        required></textarea>
                </div>


                <div class="form-group">
                    <label>Option A</label>

                    <input
                        type="text"
                        id="optionA"
                        required>
                </div>


                <div class="form-group">
                    <label>Option B</label>

                    <input
                        type="text"
                        id="optionB"
                        required>
                </div>


                <div class="form-group">
                    <label>Option C</label>

                    <input
                        type="text"
                        id="optionC"
                        required>
                </div>


                <div class="form-group">
                    <label>Option D</label>

                    <input
                        type="text"
                        id="optionD"
                        required>
                </div>


                <div class="form-group">

                    <label>Correct Answer</label>

                    <select id="correctAnswer" required>
                        <option value="">Select answer</option>
                        <option value="A">A</option>
                        <option value="B">B</option>
                        <option value="C">C</option>
                        <option value="D">D</option>
                    </select>

                </div>


                <div class="form-group">

                    <label>Explanation</label>

                    <textarea
                        id="questionExplanation"
                        placeholder="Explain why this answer is correct..."></textarea>

                </div>


                <div class="form-group">

                    <label>Marks</label>

                    <input
                        type="number"
                        id="questionMarks"
                        value="1"
                        min="1">

                </div>


                <div class="form-group">

                    <label>Negative Marks</label>

                    <input
                        type="number"
                        id="negativeMarks"
                        value="0"
                        min="0"
                        step="0.25">

                </div>


                <button class="btn btn-success" type="submit">

                    <i class="fa-solid fa-plus"></i>
                    Add Question

                </button>

            </form>

        </div>


        <!-- QUESTIONS LIST -->
        <div class="admin-card full-width">

            <h2>
                <i class="fa-solid fa-list-check"></i>
                Questions
            </h2>

            <div id="questionsList">

                <div class="empty-state">
                    Create a quiz and add questions.
                </div>

            </div>

        </div>

    </div>

</div>

<script src="js/auth.js?v=60"></script>
<script>

if (!requireAuth("admin")) { throw new Error("Admin authentication required"); }

const API_BASE = "http://localhost:5001/api";

let currentQuizId = null;


// =====================================================
// CREATE QUIZ
// =====================================================

document
.getElementById("quizForm")
.addEventListener("submit", async function(event) {

    event.preventDefault();

    const payload = {

        title:
            document.getElementById("quizTitle").value.trim(),

        description:
            document.getElementById("quizDescription").value.trim(),

        category:
            document.getElementById("quizCategory").value.trim(),

        difficulty:
            document.getElementById("quizDifficulty").value,

        subject_id:
            document.getElementById("quizSubjectId").value || null,

        topic_id:
            document.getElementById("quizTopicId").value || null,

        time_limit:
            Number(document.getElementById("quizTime").value),

        access_type:
            document.getElementById("quizAccess").value,

        published:
            document.getElementById("quizPublished").value === "true"
    };


    try {

        const response = await fetch(
            `${API_BASE}/admin/quizzes`,
            {
                method: "POST",

                headers: authHeaders({
                    "Content-Type": "application/json"
                }),

                body: JSON.stringify(payload)
            }
        );


        const result = await response.json();


        if (!response.ok || !result.success) {

            throw new Error(
                result.message || "Failed to create quiz"
            );
        }


        currentQuizId = result.data.id;


        document.getElementById("questionQuizId").value =
            currentQuizId;


        document.getElementById("quizCreatedMessage").style.display =
            "block";


        document.getElementById("createdQuizInfo").innerHTML =
            `Quiz ID: <strong>${currentQuizId}</strong>
             — ${result.data.title}`;


        alert("Quiz created successfully!");


    } catch (error) {

        console.error(error);

        alert(error.message);

    }

});


// =====================================================
// ADD QUESTION
// =====================================================

document
.getElementById("questionForm")
.addEventListener("submit", async function(event) {

    event.preventDefault();


    const quizId =
        document.getElementById("questionQuizId").value;


    if (!quizId) {

        alert("Please create a quiz first.");

        return;
    }


    const payload = {

        quiz_id: Number(quizId),

        question_text:
            document.getElementById("questionText").value.trim(),

        option_a:
            document.getElementById("optionA").value.trim(),

        option_b:
            document.getElementById("optionB").value.trim(),

        option_c:
            document.getElementById("optionC").value.trim(),

        option_d:
            document.getElementById("optionD").value.trim(),

        correct_answer:
            document.getElementById("correctAnswer").value,

        explanation:
            document.getElementById("questionExplanation").value.trim(),

        marks:
            Number(document.getElementById("questionMarks").value),

        negative_marks:
            Number(document.getElementById("negativeMarks").value)
    };


    try {

        const response = await fetch(
            `${API_BASE}/admin/questions`,
            {
                method: "POST",

                headers: authHeaders({
                    "Content-Type": "application/json"
                }),

                body: JSON.stringify(payload)
            }
        );


        const result = await response.json();


        if (!response.ok || !result.success) {

            throw new Error(
                result.message || "Failed to add question"
            );
        }


        alert("Question added successfully!");


        document.getElementById("questionForm").reset();


        document.getElementById("questionMarks").value = 1;

        document.getElementById("negativeMarks").value = 0;

        document.getElementById("questionQuizId").value =
            quizId;


        loadQuestions(quizId);


    } catch (error) {

        console.error(error);

        alert(error.message);

    }

});


// =====================================================
// LOAD QUESTIONS
// =====================================================

async function loadQuestions(quizId) {

    try {

        const response = await fetch(
            `${API_BASE}/admin/questions/${quizId}`,
            { headers: authHeaders() }
        );


        const result = await response.json();


        if (!result.success) {

            throw new Error(
                result.message || "Failed to load questions"
            );
        }


        const container =
            document.getElementById("questionsList");


        if (!result.data.length) {

            container.innerHTML = `
                <div class="empty-state">
                    No questions added yet.
                </div>
            `;

            return;
        }


        container.innerHTML =
            result.data.map((question, index) => `

                <div class="question-card">

                    <div class="question-number">
                        Question ${index + 1}
                    </div>

                    <strong>
                        ${escapeHTML(question.question_text)}
                    </strong>

                    <div class="option-row">
                        A. ${escapeHTML(question.option_a)}
                    </div>

                    <div class="option-row">
                        B. ${escapeHTML(question.option_b)}
                    </div>

                    <div class="option-row">
                        C. ${escapeHTML(question.option_c)}
                    </div>

                    <div class="option-row">
                        D. ${escapeHTML(question.option_d)}
                    </div>

                    <p>
                        <strong>Correct:</strong>
                        ${escapeHTML(question.correct_answer)}
                    </p>

                    <p>
                        <strong>Marks:</strong>
                        ${question.marks}
                        &nbsp; | &nbsp;
                        <strong>Negative:</strong>
                        ${question.negative_marks}
                    </p>

                </div>

            `).join("");


    } catch (error) {

        console.error(error);

        document.getElementById("questionsList").innerHTML = `
            <div class="empty-state">
                Unable to load questions.
            </div>
        `;

    }

}


// =====================================================
// ESCAPE HTML
// =====================================================

function escapeHTML(value) {

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

</script>

</body>
</html>
